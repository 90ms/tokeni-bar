name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Detect macOS CI scope
    runs-on: ubuntu-latest
    outputs:
      run-macos: ${{ steps.scope.outputs.run-macos }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run-macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_manifest_has_macos_impact() {
            # Package.swift contains platform-specific conditional blocks. A
            # Windows-only linker or target change must not spend a macOS
            # runner minute when the shared package definition is unchanged.
            if diff -u \
                <(git show "$BASE_SHA:Package.swift" | awk '
                  /^[[:space:]]*#if[[:space:]]+os[(]Windows[)]/ { in_windows=1; next }
                  in_windows && /^[[:space:]]*#endif/ { in_windows=0; next }
                  !in_windows { print }
                ') \
                <(git show "$HEAD_SHA:Package.swift" | awk '
                  /^[[:space:]]*#if[[:space:]]+os[(]Windows[)]/ { in_windows=1; next }
                  in_windows && /^[[:space:]]*#endif/ { in_windows=0; next }
                  !in_windows { print }
                ') \
                >/dev/null; then
              echo false
            else
              echo true
            fi
          }

          run_macos=false
          while IFS= read -r path; do
            case "$path" in
              Package.swift)
                manifest_macos_impact="$(package_manifest_has_macos_impact)"
                echo "Package.swift macOS impact: $manifest_macos_impact"
                if [[ "$manifest_macos_impact" == "true" ]]; then
                  run_macos=true
                  break
                fi
                echo "Package.swift changes are limited to the Windows conditional block."
                ;;
              Sources/TokeniCore/*|Sources/TokeniApplication/*|Sources/TokeniBar/*|Tests/TokeniCoreTests/*|Tests/TokeniApplicationTests/*|Tests/Scripts/*|Scripts/test.sh|Scripts/package_app.sh|Scripts/validate_companion_assets.sh|packaging/Info.plist|packaging/AppIcon.png|.github/workflows/ci.yml)
                run_macos=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "run-macos=$run_macos" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build, test, and validate app bundle
    needs: detect-scope
    if: needs.detect-scope.outputs.run-macos == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Validate release-note fragments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ./Scripts/validate_release_notes.sh all
          ./Scripts/validate_release_notes.sh changed "$BASE_SHA" "$HEAD_SHA"
      - name: Test
        run: ./Scripts/test.sh
      - name: Build app executable
        run: swift build -c release --product TokeniBar
      - name: Package ad-hoc app for validation
        env:
          APP_VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/agents-status-package
        run: ./Scripts/package_app.sh
      - name: Validate app bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/agents-status-package/Tokeni Bar.app"
          test -x "$app/Contents/MacOS/TokeniBar"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -d "$app/Contents/Resources/TokeniBar_TokeniBar.bundle/CompanionAssets/bytebot"
          test -d "$app/Contents/Resources/TokeniBar_TokeniBar.bundle/BrandIcons"
          companion="$app/Contents/Resources/TokeniBar_TokeniBar.bundle/CompanionAssets/bytebot"
          test "$(plutil -extract schemaVersion raw "$companion/manifest.json")" = "2"
          for asset in \
            egg.png \
            baby.png \
            hatchling-rare.png \
            hatchling-epic.png \
            hatchling-legendary.png \
            junior-normal.png \
            junior-rare.png \
            junior-epic.png \
            junior-legendary.png \
            adult.png \
            adult-rare.png \
            adult-epic.png \
            adult-legendary.png
          do
            test -f "$companion/$asset"
          done
          plutil -lint "$app/Contents/Info.plist"
          test "$(defaults read "$app/Contents/Info" CFBundleIdentifier)" = "dev.agentsstatusbar.app"
          test "$(defaults read "$app/Contents/Info" CFBundleIconFile)" = "AppIcon"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "0.0.0"
          test "$(defaults read "$app/Contents/Info" CFBundleVersion)" = "$GITHUB_RUN_NUMBER"
