name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<major>.<minor>.<patch> tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v<major>.<minor>.<patch>, got: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Render structured release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./Scripts/render_release_notes.sh "$VERSION" dist/release-notes.md

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          APP_SIGN_IDENTITY: "-"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package_app.sh

      - name: Create release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "dist/Tokeni Bar.app" \
            "dist/TokeniBar-$VERSION.zip"

      - name: Generate checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "TokeniBar-$VERSION.zip" \
            > "TokeniBar-$VERSION.zip.sha256"

      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/TokeniBar-${{ steps.version.outputs.value }}.zip

      - name: Download Formula source archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --output "dist/tokeni-bar-$VERSION-source.tar.gz" \
            "https://github.com/90ms/tokeni-bar/archive/refs/tags/v$VERSION.tar.gz"
          shasum -a 256 "dist/tokeni-bar-$VERSION-source.tar.gz" \
            > "dist/tokeni-bar-$VERSION-source.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/TokeniBar-$VERSION.zip" \
            "dist/TokeniBar-$VERSION.zip.sha256" \
            --notes-file "dist/release-notes.md" \
            --verify-tag

      - name: Open Homebrew distribution update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping the tap pull request."
            exit 0
          fi

          release_sha="$(awk '{print $1}' "dist/TokeniBar-$VERSION.zip.sha256")"
          source_sha="$(awk '{print $1}' "dist/tokeni-bar-$VERSION-source.tar.gz.sha256")"
          tap="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          gh repo clone 90ms/homebrew-tap "$tap"
          branch="automation/tokeni-bar-$VERSION"
          branch_ready=false
          if git -C "$tap" ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/$branch" >/dev/null
          then
            git -C "$tap" checkout -B "$branch" "origin/$branch"
            branch_ready=true
          else
            git -C "$tap" checkout -b "$branch"
          fi

          ./Scripts/render_homebrew_cask.sh \
            "$VERSION" \
            "$release_sha" \
            "$tap/Casks/tokeni-bar.rb"
          ./Scripts/render_homebrew_formula.sh \
            "$VERSION" \
            "$source_sha" \
            "$tap/Formula/tokeni-bar.rb"

          git -C "$tap" add Casks/tokeni-bar.rb Formula/tokeni-bar.rb
          if ! git -C "$tap" diff --cached --quiet -- \
            Casks/tokeni-bar.rb \
            Formula/tokeni-bar.rb
          then
            git -C "$tap" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "tokeni-bar $VERSION"
            git -C "$tap" push origin "$branch"
            branch_ready=true
          fi

          if [[ "$branch_ready" != "true" ]]; then
            echo "Homebrew tap already contains tokeni-bar $VERSION."
            exit 0
          fi

          if [[ "$(gh pr list \
            --repo 90ms/homebrew-tap \
            --head "$branch" \
            --json number \
            --jq length)" != "0" ]]
          then
            echo "Tap pull request already exists for $branch."
          else
            gh pr create \
              --repo 90ms/homebrew-tap \
              --head "$branch" \
              --base main \
              --title "tokeni-bar $VERSION" \
              --body "Automated Formula and compatibility Cask update for 90ms/tokeni-bar@$RELEASE_TAG. Merge only after tap CI and the release checklist pass."
          fi
