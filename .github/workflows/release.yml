name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<major>.<minor>.<patch> tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-package:
    name: Build and validate Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag must use v<major>.<minor>.<patch>, got: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag was not found: $env:RELEASE_TAG"
          }
          "tag=$env:RELEASE_TAG" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append
          "value=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      - name: Restore SwiftPM build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: windows-release-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            windows-release-swiftpm-
            windows-swiftpm-

      - name: Set up Swift for Windows
        uses: ./.github/actions/setup-windows-swift

      - name: Test Windows release suite
        shell: pwsh
        run: |
          swift test --parallel

      - name: Build Windows executable
        shell: pwsh
        run: |
          swift build --configuration release --product TokeniWindows
          $buildPath = (swift build `
            --configuration release `
            --product TokeniWindows `
            --show-bin-path).Trim()
          if (-not (Test-Path (Join-Path $buildPath "TokeniWindows.exe"))) {
            throw "TokeniWindows.exe was not produced in $buildPath."
          }
          "SWIFT_BIN_PATH=$buildPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Create portable Windows package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $targetInfo = (swiftc -print-target-info | ConvertFrom-Json)
          $runtimeDirectories = @(
            $targetInfo.paths.runtimeLibraryPaths |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          )
          if ($runtimeDirectories.Count -eq 0) {
            throw "Swift runtime library directories could not be located."
          }
          & "$env:GITHUB_WORKSPACE\Scripts\package_windows.ps1" `
            -Version $env:VERSION `
            -BuildDirectory "$env:SWIFT_BIN_PATH" `
            -OutputDirectory "$env:RUNNER_TEMP\TokeniWindowsRelease" `
            -RuntimeDirectory $runtimeDirectories

      - name: Validate Windows release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $archive = Join-Path `
            "$env:RUNNER_TEMP\TokeniWindowsRelease" `
            "Tokeni-Bar-Windows-$env:VERSION.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Windows release archive was not created: $archive"
          }
          if (-not (Test-Path -LiteralPath "$archive.sha256" -PathType Leaf)) {
            throw "Windows release checksum was not created: $archive.sha256"
          }
          $checksumBytes = [System.IO.File]::ReadAllBytes("$archive.sha256")
          $hasCarriageReturn = $checksumBytes -contains 13
          if ($checksumBytes.Count -eq 0 -or $checksumBytes[-1] -ne 10 -or $hasCarriageReturn) {
            throw "Windows release checksum must use a single LF line ending."
          }
          $expectedHash = ((Get-Content -LiteralPath "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Windows release checksum does not match the archive."
          }
          $validationDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "TokeniWindowsReleaseValidation"
          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath $validationDirectory
          & "$env:GITHUB_WORKSPACE\Scripts\validate_windows_companion_assets.ps1" `
            -AssetRoot (Join-Path $validationDirectory "Resources\CompanionAssets")
          if (-not (Test-Path -LiteralPath (Join-Path $validationDirectory "TokeniWindows.exe") -PathType Leaf)) {
            throw "Validated package does not contain TokeniWindows.exe."
          }

      - name: Smoke-test unpacked Windows release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $archive = Join-Path `
            "$env:RUNNER_TEMP\TokeniWindowsRelease" `
            "Tokeni-Bar-Windows-$env:VERSION.zip"
          & "$env:GITHUB_WORKSPACE\Scripts\smoke_windows_package.ps1" `
            -ArchivePath $archive

      - name: Generate Windows artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ runner.temp }}\TokeniWindowsRelease\Tokeni-Bar-Windows-${{ steps.version.outputs.value }}.zip

      - name: Upload validated Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokeni-bar-windows-release-${{ steps.version.outputs.value }}
          path: |
            ${{ runner.temp }}\TokeniWindowsRelease\Tokeni-Bar-Windows-${{ steps.version.outputs.value }}.zip
            ${{ runner.temp }}\TokeniWindowsRelease\Tokeni-Bar-Windows-${{ steps.version.outputs.value }}.zip.sha256
          if-no-files-found: error

  release:
    name: Build and publish cross-platform release
    needs: windows-package
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v<major>.<minor>.<patch>, got: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Render structured release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./Scripts/render_release_notes.sh "$VERSION" dist/release-notes.md

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          APP_SIGN_IDENTITY: "-"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package_app.sh

      - name: Create release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "dist/Tokeni Bar.app" \
            "dist/TokeniBar-$VERSION.zip"

      - name: Generate checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "TokeniBar-$VERSION.zip" \
            > "TokeniBar-$VERSION.zip.sha256"

      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/TokeniBar-${{ steps.version.outputs.value }}.zip

      - name: Download validated Windows release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tokeni-bar-windows-release-${{ steps.version.outputs.value }}
          path: dist/windows

      - name: Download Formula source archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --output "dist/tokeni-bar-$VERSION-source.tar.gz" \
            "https://github.com/90ms/tokeni-bar/archive/refs/tags/v$VERSION.tar.gz"
          shasum -a 256 "dist/tokeni-bar-$VERSION-source.tar.gz" \
            > "dist/tokeni-bar-$VERSION-source.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          assets=(
            "dist/TokeniBar-$VERSION.zip"
            "dist/TokeniBar-$VERSION.zip.sha256"
            "dist/windows/Tokeni-Bar-Windows-$VERSION.zip"
            "dist/windows/Tokeni-Bar-Windows-$VERSION.zip.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --notes-file "dist/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --notes-file "dist/release-notes.md" \
              --verify-tag
          fi

      - name: Open Homebrew distribution update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping the tap pull request."
            exit 0
          fi

          release_sha="$(awk '{print $1}' "dist/TokeniBar-$VERSION.zip.sha256")"
          source_sha="$(awk '{print $1}' "dist/tokeni-bar-$VERSION-source.tar.gz.sha256")"
          tap="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          gh repo clone 90ms/homebrew-tap "$tap"
          branch="automation/tokeni-bar-$VERSION"
          branch_ready=false
          if git -C "$tap" ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/$branch" >/dev/null
          then
            git -C "$tap" checkout -B "$branch" "origin/$branch"
            branch_ready=true
          else
            git -C "$tap" checkout -b "$branch"
          fi

          ./Scripts/render_homebrew_cask.sh \
            "$VERSION" \
            "$release_sha" \
            "$tap/Casks/tokeni-bar.rb"
          ./Scripts/render_homebrew_formula.sh \
            "$VERSION" \
            "$source_sha" \
            "$tap/Formula/tokeni-bar.rb"

          git -C "$tap" add Casks/tokeni-bar.rb Formula/tokeni-bar.rb
          if ! git -C "$tap" diff --cached --quiet -- \
            Casks/tokeni-bar.rb \
            Formula/tokeni-bar.rb
          then
            git -C "$tap" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "tokeni-bar $VERSION"
            git -C "$tap" push origin "$branch"
            branch_ready=true
          fi

          if [[ "$branch_ready" != "true" ]]; then
            echo "Homebrew tap already contains tokeni-bar $VERSION."
            exit 0
          fi

          if [[ "$(gh pr list \
            --repo 90ms/homebrew-tap \
            --head "$branch" \
            --json number \
            --jq length)" != "0" ]]
          then
            echo "Tap pull request already exists for $branch."
          else
            gh pr create \
              --repo 90ms/homebrew-tap \
              --head "$branch" \
              --base main \
              --title "tokeni-bar $VERSION" \
              --body "Automated Formula and compatibility Cask update for 90ms/tokeni-bar@$RELEASE_TAG. Merge only after tap CI and the release checklist pass."
          fi
