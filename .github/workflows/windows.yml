name: Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Detect Windows CI scope
    runs-on: ubuntu-latest
    outputs:
      run-windows: ${{ steps.scope.outputs.run-windows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_windows=false
          while IFS= read -r path; do
            case "$path" in
              Package.swift|Sources/TokeniCore/*|Sources/TokeniApplication/*|Sources/TokeniWindows/*|Sources/TokeniWindowsNative/*|Sources/TokeniBar/CompanionAssets/*|Tests/TokeniCoreTests/*|Tests/TokeniApplicationTests/*|Tests/TokeniWindowsTests/*|Scripts/package_windows.ps1|Scripts/validate_windows_companion_assets.ps1|.github/actions/setup-windows-swift/*|.github/workflows/windows.yml|.github/workflows/release.yml)
                run_windows=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "run-windows=$run_windows" >> "$GITHUB_OUTPUT"

  build-test-package:
    name: Build, test, and package Windows app
    needs: detect-scope
    if: needs.detect-scope.outputs.run-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore SwiftPM build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: windows-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            windows-swiftpm-

      - name: Set up Swift for Windows
        uses: ./.github/actions/setup-windows-swift

      - name: Test Windows suite
        shell: pwsh
        run: |
          swift test --parallel

      - name: Build Windows executable
        shell: pwsh
        run: |
          swift build --configuration release --product TokeniWindows
          $buildPath = (swift build `
            --configuration release `
            --product TokeniWindows `
            --show-bin-path).Trim()
          if (-not (Test-Path (Join-Path $buildPath "TokeniWindows.exe"))) {
            throw "TokeniWindows.exe was not produced in $buildPath."
          }
          "SWIFT_BIN_PATH=$buildPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $targetInfo = (swiftc -print-target-info | ConvertFrom-Json)
          $runtimeDirectories = @(
            $targetInfo.paths.runtimeLibraryPaths |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          )
          if ($runtimeDirectories.Count -eq 0) {
            throw "Swift runtime library directories could not be located."
          }
          & "$env:GITHUB_WORKSPACE\Scripts\package_windows.ps1" `
            -Version "0.0.0" `
            -BuildDirectory "$env:SWIFT_BIN_PATH" `
            -OutputDirectory "$env:RUNNER_TEMP\TokeniWindowsPackage" `
            -RuntimeDirectory $runtimeDirectories

      - name: Validate packaged companion assets
        shell: pwsh
        run: |
          $archive = Get-ChildItem `
            -LiteralPath "$env:RUNNER_TEMP\TokeniWindowsPackage" `
            -Filter "*.zip" `
            -File |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw "Windows package archive was not created."
          }
          $checksumPath = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Windows package checksum was not created."
          }
          $expectedHash = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Windows package checksum does not match the archive."
          }
          $validationDirectory = Join-Path `
            $env:RUNNER_TEMP `
            "TokeniWindowsPackageValidation"
          if (Test-Path -LiteralPath $validationDirectory) {
            Remove-Item -LiteralPath $validationDirectory -Recurse -Force
          }
          Expand-Archive `
            -LiteralPath $archive.FullName `
            -DestinationPath $validationDirectory
          $assetRoot = Join-Path `
            $validationDirectory `
            "Resources\CompanionAssets"
          & "$env:GITHUB_WORKSPACE\Scripts\validate_windows_companion_assets.ps1" `
            -AssetRoot $assetRoot
          if (-not (Test-Path -LiteralPath (Join-Path $validationDirectory "TokeniWindows.exe") -PathType Leaf)) {
            throw "Validated package does not contain TokeniWindows.exe."
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokeni-bar-windows-${{ github.sha }}
          path: ${{ runner.temp }}\TokeniWindowsPackage\*.zip*
          if-no-files-found: error
