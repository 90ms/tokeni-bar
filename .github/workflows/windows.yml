name: Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Detect Windows CI scope
    runs-on: ubuntu-latest
    outputs:
      run-windows: ${{ steps.scope.outputs.run-windows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_windows=false
          while IFS= read -r path; do
            case "$path" in
              Package.swift|Sources/TokeniCore/*|Sources/TokeniApplication/*|Sources/TokeniWindows/*|Sources/TokeniWindowsNative/*|Tests/TokeniCoreTests/*|Tests/TokeniApplicationTests/*|Tests/TokeniWindowsTests/*|Scripts/package_windows.ps1|.github/workflows/windows.yml)
                run_windows=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "run-windows=$run_windows" >> "$GITHUB_OUTPUT"

  build-test-package:
    name: Build, test, and package Windows app
    needs: detect-scope
    if: needs.detect-scope.outputs.run-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: windows-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            windows-swiftpm-

      - name: Install Swift toolchain
        shell: pwsh
        run: |
          $swiftCommand = Get-Command swift -ErrorAction SilentlyContinue
          if ($null -eq $swiftCommand) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($null -eq $winget) {
              throw "WinGet is required to install the Swift toolchain."
            }

            # WinGet can return a non-zero code after successfully installing a
            # dependency, and PowerShell 7 may treat that native exit as an
            # action error before the script can inspect it. The executable
            # discovered below is the authoritative result for this step.
            $PSNativeCommandUseErrorActionPreference = $false
            & $winget.Source install `
              --id Swift.Toolchain `
              --exact `
              --source winget `
              --accept-source-agreements `
              --accept-package-agreements `
              --disable-interactivity
            $wingetExitCode = $LASTEXITCODE

            $swiftExecutable = Get-ChildItem `
              -Path "$env:LOCALAPPDATA\Programs\Swift", "$env:ProgramFiles\Swift" `
              -Filter swift.exe `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $swiftExecutable) {
              throw "Swift was installed but swift.exe could not be located (WinGet exit $wingetExitCode)."
            }

            $swiftRuntimeDll = Get-ChildItem `
              -Path "$env:LOCALAPPDATA\Programs\Swift", "$env:ProgramFiles\Swift" `
              -Filter swiftCore.dll `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $swiftRuntimeDll) {
              throw "Swift was installed but its runtime DLLs could not be located (WinGet exit $wingetExitCode)."
            }

            if ($wingetExitCode -ne 0) {
              Write-Warning "WinGet returned exit $wingetExitCode after installing Swift.Toolchain; continuing because swift.exe was found."
            }

            $swiftDirectory = $swiftExecutable.Directory.FullName
            $swiftRuntimeDirectory = $swiftRuntimeDll.Directory.FullName
            $pathEntries = @($swiftDirectory, $swiftRuntimeDirectory)
            $env:PATH = (($pathEntries + $env:PATH.Split(';')) |
              Select-Object -Unique) -join ';'
            $pathEntries | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append
          }

          swift --version
          if ($LASTEXITCODE -ne 0) {
            throw "Swift toolchain was found but could not execute (exit $LASTEXITCODE)."
          }

      - name: Configure Windows SDK and MSVC
        shell: pwsh
        run: |
          $swiftSDK = Get-ChildItem `
            -Path "$env:LOCALAPPDATA\Programs\Swift", "$env:ProgramFiles\Swift" `
            -Filter Windows.sdk `
            -Directory `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $swiftSDK) {
            throw "Swift Windows SDK could not be located."
          }

          $env:SDKROOT = $swiftSDK.FullName
          "SDKROOT=$env:SDKROOT" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          $vsWhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vsWhere -PathType Leaf)) {
            throw "Visual Studio locator was not found."
          }

          $vsInstallPath = (& $vsWhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath |
            Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($vsInstallPath)) {
            throw "Visual Studio C++ build tools were not found."
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "Visual Studio developer command script was not found."
          }

          $vsCommand = '"{0}" -arch=x64 -host_arch=x64 && set' -f $vsDevCmd
          $vsEnvironment = & cmd.exe /d /s /c $vsCommand
          $vsExitCode = $LASTEXITCODE
          if ($vsExitCode -ne 0) {
            throw "Visual Studio developer environment failed to initialize (exit $vsExitCode)."
          }

          $persistedEnvironmentNames = @(
            "Path",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "VCToolsInstallDir",
            "VCINSTALLDIR",
            "WindowsSdkDir",
            "UniversalCRTSdkDir",
            "UCRTVersion",
            "VCToolsVersion",
            "VSCMD_ARG_TGT_ARCH",
            "VSCMD_ARG_HOST_ARCH",
            "VSCMD_VER",
            "VSINSTALLDIR",
            "VisualStudioVersion"
          )
          foreach ($line in $vsEnvironment) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) {
              continue
            }
            $name = $line.Substring(0, $separator)
            if ($persistedEnvironmentNames -notcontains $name) {
              continue
            }
            $value = $line.Substring($separator + 1)
            [Environment]::SetEnvironmentVariable($name, $value, "Process")
            "$name=$value" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append
          }

          if ($null -eq (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw "Visual Studio link.exe is not available after environment setup."
          }

      - name: Test Windows package surface
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          swift test --parallel --filter WindowsAppUpdateInstallerTests
          swift test --parallel --filter WindowsUsageDetailFormatterTests

      - name: Build Windows executable
        shell: pwsh
        run: |
          swift build --configuration release --product TokeniWindows
          $buildPath = (swift build `
            --configuration release `
            --product TokeniWindows `
            --show-bin-path).Trim()
          if (-not (Test-Path (Join-Path $buildPath "TokeniWindows.exe"))) {
            throw "TokeniWindows.exe was not produced in $buildPath."
          }
          "SWIFT_BIN_PATH=$buildPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $targetInfo = (swiftc -print-target-info | ConvertFrom-Json)
          $runtimeDirectories = @(
            $targetInfo.paths.runtimeLibraryPaths |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          )
          if ($runtimeDirectories.Count -eq 0) {
            throw "Swift runtime library directories could not be located."
          }
          & "$env:GITHUB_WORKSPACE\Scripts\package_windows.ps1" `
            -Version "0.0.0" `
            -BuildDirectory "$env:SWIFT_BIN_PATH" `
            -OutputDirectory "$env:RUNNER_TEMP\TokeniWindowsPackage" `
            -RuntimeDirectory $runtimeDirectories

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: tokeni-bar-windows-${{ github.sha }}
          path: ${{ runner.temp }}\TokeniWindowsPackage\*.zip
          if-no-files-found: error
