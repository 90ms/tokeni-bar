name: Windows desktop controls

on:
  pull_request:
    paths:
      - 'Sources/TokeniWindowsNative/**'
      - 'Tests/TokeniWindowsDashboardTests/**'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/TokeniWindowsNative/**'
      - 'Tests/TokeniWindowsDashboardTests/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-controls:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and exercise native desktop controls
        shell: pwsh
        run: |
          $locator = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = (& $locator -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) { throw "C++ build tools are unavailable." }
          $developerCommand = '"{0}\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && set' -f $installation
          & cmd.exe /d /s /c $developerCommand | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $output = Join-Path $env:RUNNER_TEMP 'tokeni-desktop-tests'
          New-Item -ItemType Directory -Force $output | Out-Null
          Push-Location $output
          try {
            & cl.exe /nologo /std:c11 /W3 /utf-8 "/I$env:GITHUB_WORKSPACE\Sources\TokeniWindowsNative\include" "$env:GITHUB_WORKSPACE\Tests\TokeniWindowsDashboardTests\main.c" "$env:GITHUB_WORKSPACE\Sources\TokeniWindowsNative\WindowsProviderState.c" "$env:GITHUB_WORKSPACE\Sources\TokeniWindowsNative\WindowsOverlayNative.c" /Fe:desktop-tests.exe /link gdi32.lib advapi32.lib ole32.lib uuid.lib windowscodecs.lib
            if ($LASTEXITCODE -ne 0) { throw "Desktop harness compilation failed." }
            $test = Start-Process './desktop-tests.exe' -ArgumentList '--background' -WindowStyle Hidden -PassThru -RedirectStandardOutput 'stdout.txt' -RedirectStandardError 'stderr.txt'
            if (-not $test.WaitForExit(30000)) {
              Stop-Process -Id $test.Id
              throw "Desktop harness timed out."
            }
            Get-Content stdout.txt, stderr.txt
            if ($test.ExitCode -ne 0) { throw "Desktop harness failed." }
          } finally { Pop-Location }
